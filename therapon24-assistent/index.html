<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Therapon24 Assistent</title>
<meta name="description" content="Interner Assistent für Schulbegleitungen und Mitarbeitende von Therapon24 — Antworten zu Zeiterfassung, Krankmeldung, Urlaub und Schulalltag.">
<meta name="theme-color" content="#42628F">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ===== Icon-Vorrat (einmal definiert, überall per <use> referenziert) ==== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-clock"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
    <g id="i-health"><path d="M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z"/><path d="M8.5 12h2l1-2 1.5 4 1-2h1.5"/></g>
    <g id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></g>
    <g id="i-euro"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5A4.5 4.5 0 0 0 9 12a4.5 4.5 0 0 0 6.5 3.5M7.5 10.8h5M7.5 13.3h5"/></g>
    <g id="i-school"><path d="M3 9.5 12 5l9 4.5-9 4.5-9-4.5z"/><path d="M7 11.7V16c0 1.1 2.2 2.3 5 2.3s5-1.2 5-2.3v-4.3"/></g>
    <g id="i-shield"><path d="M12 3l7 3v5.5c0 4.3-3 8.1-7 9.5-4-1.4-7-5.2-7-9.5V6l7-3z"/><path d="M9.3 12l1.9 1.9 3.5-3.6"/></g>
    <g id="i-spark"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8z"/></g>
    <g id="i-doc"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
    <g id="i-info"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g>
    <g id="i-warn"><path d="M12 4l9 15.5H3L12 4z"/><path d="M12 10v4M12 17h.01"/></g>
    <g id="i-urgent"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></g>
    <g id="i-ok"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.7"/></g>
    <g id="i-send"><path d="M4.5 11.8 20 4.6l-7.2 15.5-1.9-6.3-6.4-2z"/></g>
    <g id="i-menu"><path d="M4 7h16M4 12h16M4 17h16"/></g>
    <g id="i-close"><path d="M6 6l12 12M18 6L6 18"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></g>
    <g id="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8.2 8.2 0 1 0 10.5 10.5z"/></g>
    <g id="i-sunny"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.5 1.5M17.9 17.9l1.5 1.5M2.5 12h2M19.5 12h2M4.6 19.4l1.5-1.5M17.9 6.1l1.5-1.5"/></g>
    <g id="i-phone"><path d="M6 3.5h3l1.5 4-2 1.4a12 12 0 0 0 5.6 5.6l1.4-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4 5.7 2 2 0 0 1 6 3.5z"/></g>
    <g id="i-mail"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></g>
    <g id="i-up"><path d="M7 11l3.4-6.3a1.8 1.8 0 0 1 3.4.8V10h3.6a2 2 0 0 1 2 2.4l-1.1 5.3a2 2 0 0 1-2 1.6H7"/><path d="M7 11v8.3H4.8V11H7z"/></g>
    <g id="i-down"><path d="M17 13l-3.4 6.3a1.8 1.8 0 0 1-3.4-.8V14H6.6a2 2 0 0 1-2-2.4l1.1-5.3a2 2 0 0 1 2-1.6H17"/><path d="M17 13V4.7h2.2V13H17z"/></g>
    <g id="i-reset"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V10H9"/></g>
    <g id="i-pfeil"><path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></g>
    <g id="i-neu"><path d="M16.5 3.8a2 2 0 0 1 2.8 2.8L9.5 16.4l-3.7 1 1-3.7 9.7-9.9z"/><path d="M4 20.5h16"/></g>
  </defs>
</svg>

<div class="app" id="app" data-zustand="leer">

  <!-- ===================== Kopfzeile ===================== -->
  <header class="kopf">
    <button class="ikonbtn" id="btnThemen" type="button"
            title="Alle Themen" aria-label="Alle Themen anzeigen" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><use href="#i-menu"/></svg>
    </button>

    <img class="kopf__logo" src="img/logo.svg" alt="Therapon24">

    <div class="kopf__spacer"></div>

    <button class="ikonbtn" id="btnTheme" type="button"
            title="Hell / Dunkel" aria-label="Zwischen hellem und dunklem Modus wechseln">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><use href="#i-moon" id="themeIkon"/></svg>
    </button>

    <button class="ikonbtn" id="btnNeu" type="button"
            title="Neues Gespräch" aria-label="Neues Gespräch beginnen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><use href="#i-neu"/></svg>
    </button>
  </header>

  <!-- ===================== Verlauf (Chatzustand) ===================== -->
  <main class="verlauf" id="verlauf" role="log" aria-live="polite"
        aria-label="Gesprächsverlauf"></main>

  <!-- ===================== Bühne (Leerzustand) ===================== -->
  <div class="buehne" id="buehne">
    <div class="buehne__inhalt">
      <img class="buehne__zeichen" src="img/mark.svg" alt="" aria-hidden="true">
      <h1 class="buehne__titel">Womit kann ich helfen?</h1>
      <p class="buehne__unter" id="buehneUnter">
        Frag einfach los — zu Zeiterfassung, Krankmeldung, Urlaub oder Schulalltag.
      </p>
      <div id="buehnenSlot"></div>
    </div>
  </div>

  <!-- ===================== Eingabe (wandert) ===================== -->
  <div class="dock" id="dock">
    <div class="mitte">
      <form class="eingabe" id="formular" autocomplete="off">
        <label for="feld" style="position:absolute;left:-9999px">Deine Frage</label>
        <textarea class="eingabe__feld" id="feld" rows="1"
                  placeholder="Frage eingeben …" enterkeyhint="send"></textarea>
        <button class="eingabe__senden" id="btnSenden" type="submit" disabled
                aria-label="Frage senden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><use href="#i-pfeil"/></svg>
        </button>
      </form>
      <div class="vorschlaege" id="vorschlaege"></div>
      <p class="fussnote">
        Interne Orientierungshilfe — ersetzt keine verbindliche Auskunft.
        Im Zweifel gilt dein Arbeitsvertrag.
      </p>
    </div>
  </div>
</div>

<!-- ===================== Seitenleiste: Themen ===================== -->
<div class="schublade" id="schublade" role="dialog" aria-modal="true" aria-label="Alle Themen">
  <div class="schublade__hinter" data-schliessen></div>
  <div class="schublade__inhalt">
    <div class="schublade__kopf">
      <h2>Themen</h2>
      <button class="ikonbtn" type="button" data-schliessen aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="schublade__suche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round"><use href="#i-search"/></svg>
      <input type="search" id="suche" placeholder="Thema suchen …" aria-label="Thema suchen">
    </div>
    <div id="setupHinweis"></div>
    <div class="schublade__liste" id="themenListe"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/wissen.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
